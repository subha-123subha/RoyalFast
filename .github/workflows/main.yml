name: Build Royal Fast APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Royal Fast project
        run: |
          FILE=$(find . -name "RoyalFast_Project_288KB.txt" -type f | head -n 1)
          echo "Found file: $FILE"
          base64 -d "$FILE" > royalfast.zip
          unzip -o royalfast.zip
          cp -a RoyalFast_Final_Source/. .
          rm -rf RoyalFast_Final_Source royalfast.zip "$FILE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalFast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
