name: Build Royal Fast APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RoyalFast ZIP
        run: |
          unzip -o RoyalFast_FAST.zip
          find . -name "build.gradle" -o -name "settings.gradle"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
         cd src/RoyalFast_Final_Source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalFast-debug-apk
          path: src/RoyalFast_Final_Source/app/build/outputs/apk/debug/*.apk
